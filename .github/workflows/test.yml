name: Tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: PYTHONPATH=backend python -m app.cli migrate
      - run: node --check frontend/app.js
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-chi-sim
      - run: PYTHONPATH=backend pytest -q backend/integration/test_document_tools.py
